[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# VITE_API_BASE_URL must still be set in the Netlify dashboard
# (Site settings -> Environment variables) -- it's not safe to hardcode
# here since this file is committed to git and the value differs between
# your local/staging/production backends.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
